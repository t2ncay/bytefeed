[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bytefeed"
version = "0.1.0"
description = "A modern, asynchronous 2026 Terminal UI News Feed for Windows Terminal."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tuncay"}
]
dependencies = [
    "textual>=0.50.0",
    "feedparser>=6.0.10",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
bytefeed = "bytefeed.app:main"
bf = "bytefeed.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"